# Builds the release programs on Linux and on Windows and uploads one zip per platform: the two
# programs, the instrument sets (the kit at locks/kit.lock's commit and assets/instruments), the
# bundled Surge XT plugin of the platform with its factory data, the icon, the demo project, the
# documentation and the license files (scripts/package.sh). Runs by hand or on a pushed v* tag;
# the zips are the run's artifacts, ready to attach to a release, with Surge XT's complete
# source (locks/surge.lock's surge-src tarball), which a release attaches beside them: the zips'
# SOURCES.md offers it there.
# Each action is pinned to a full commit, its version in the comment beside it: a tag can be
# moved to other code, a commit cannot. .github/dependabot.yml proposes newer ones each week.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The zips are this run's artifacts and a release gets them attached by hand, so the token only
# reads; the checkout keeps no copy of it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where scripts/fetch-kit.sh clones the instrument sets from, when the repository's variable
  # says; else locks/kit.lock's url.
  DAWSOME_KIT_URL: ${{ vars.DAWSOME_KIT_URL }}

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev \
            pkg-config libasound2-dev libpipewire-0.3-dev libjack-jackd2-dev libdbus-1-dev
      - name: libclang
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm -y --no-progress
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16 (no releases; Rust's version is the toolchain line)
        with:
          toolchain: "1.93.1"
      # The runner's folders mapped out of the programs (scripts/remap-paths.sh); package.sh
      # refuses a program that still names the home folder.
      - run: cargo build --release --locked --config "$(scripts/remap-paths.sh)" -p dawsome -p dawsome-app
      - run: scripts/fetch-kit.sh
      # The platform's Surge XT, each download held to locks/surge.lock's SHA-256; on Linux the
      # release's complete source too.
      - run: scripts/fetch-surge.sh "${{ matrix.platform }}"
      - run: scripts/fetch-surge.sh --source linux-x86_64
        if: runner.os == 'Linux'
      - run: scripts/package.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dawsome-${{ matrix.platform }}
          path: target/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: surge-source
          path: target/surge/downloads/surge-src-*/surge-src-*.tar.gz
          if-no-files-found: error
          compression-level: 0
