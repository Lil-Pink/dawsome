# Scans the programs of each published release with VirusTotal and adds the report links to the
# release notes. The release zips are unpacked first: VirusTotal's free API takes files up to
# 32 MB, and the programs inside are what a scan of a download judges. Runs when a release is
# published, or by hand for a release that already exists (Actions → VirusTotal → Run workflow).
# Needs the repository secret VT_API_KEY.
name: VirusTotal
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to scan (e.g. v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: The release's programs
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir zips --pattern 'dawsome-*.zip'
          mkdir -p unpacked scan/linux scan/windows
          for zip in zips/*.zip; do unzip -q "$zip" -d unpacked; done
          cp unpacked/dawsome-*-linux-*/dawsome unpacked/dawsome-*-linux-*/dawsome-app scan/linux/
          cp unpacked/dawsome-*-windows-*/dawsome.exe unpacked/dawsome-*-windows-*/dawsome-app.exe scan/windows/
          ls -l scan/linux scan/windows
      - name: Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            ./scan/windows/dawsome-app.exe
            ./scan/windows/dawsome.exe
            ./scan/linux/dawsome-app
            ./scan/linux/dawsome
      - name: The reports in the release notes
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          # A section written by an earlier run is replaced, not added to.
          sed -i '/^<!-- virustotal -->$/,$d' body.md
          lines=()
          while IFS='=' read -r file url; do
            [ -n "$file" ] || continue
            name="${file#./}"; name="${name#scan/}"
            id="$(printf '%s' "$url" | sed -E 's#.*/file-analysis/([^/]+)/.*#\1#')"
            # Each analysis is read until it completes: one request every 20 s keeps to the free
            # key's 4 a minute; 15 minutes at most.
            status=""
            for _ in $(seq 45); do
              json="$(curl -sf -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$id" || true)"
              status="$(jq -r '.data.attributes.status // empty' <<<"$json")"
              [ "$status" = completed ] && break
              sleep 20
            done
            if [ "$status" = completed ]; then
              flagged="$(jq -r '.data.attributes.stats | .malicious + .suspicious' <<<"$json")"
              engines="$(jq -r '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<<"$json")"
              sha="$(jq -r '.meta.file_info.sha256' <<<"$json")"
              lines+=("- \`$name\`: $flagged of $engines engines flagged it ([report](https://www.virustotal.com/gui/file/$sha))")
            else
              lines+=("- \`$name\`: still being scanned ([report]($url))")
            fi
          done < <(printf '%s\n' "$ANALYSIS" | tr ',' '\n')
          {
            echo '<!-- virustotal -->'
            echo '### VirusTotal'
            echo
            echo 'The programs in the zips, scanned with VirusTotal when this release was published:'
            echo
            printf '%s\n' "${lines[@]}"
          } >> body.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
