[package]
name = "dawsome-host-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dawsome's CLAP plugin host: the out-of-process scan and its catalogue, and CLAP instruments and effects behind the engine's processor port. The plugin ABI lives only here."

[dependencies]
dawsome-engine.workspace = true
dawsome-host-common.workspace = true
# Pinned: the host layer follows this exact API (instance lifetimes, handler traits).
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "audio-ports", "gui", "latency", "note-ports", "params", "posix-fd", "state", "thread-check", "timer"] }
# A plugin's state is stored in the project as standard padded base64 text.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# poll(2) for the file descriptors plugins register.
libc = "0.2"

[dev-dependencies]
# Reads the known answers tests/fixtures/gen_p29_expected.py writes (its "clap" key).
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The window tests (tests/windows.rs, ignored: they need an X display) call the test interface's
# exports and look at the host's windows on a connection of their own.
libloading = "0.8"
x11rb = "0.13"
